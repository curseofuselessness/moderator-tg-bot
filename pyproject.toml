[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "artifacts", "data", "notebooks", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S"]
ignore = ["E501", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "ml_service", "shared", "training", "analytics"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers", "--tb=short",
           "--cov=bot", "--cov=ml_service", "--cov=shared", "--cov=training",
           "--cov-report=term-missing"]
markers = ["unit: unit tests", "integration: integration tests", "slow: slow"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
exclude = ["alembic/", "notebooks/", "tests/"]

[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "aiogram.*", "streamlit.*"]
ignore_missing_imports = true